<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Immersion Eventos</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family: Arial, sans-serif; background:#f4f6f8; color:#111; }
    header { background:#111; color:white; padding:22px 16px; text-align:center; }
    header h1 { margin:0; font-size:26px; }
    header p { margin:6px 0 0; opacity:.85; }
    main { max-width:900px; margin:0 auto; padding:16px; }
    .card { background:white; border-radius:18px; padding:18px; margin:14px 0; box-shadow:0 4px 18px rgba(0,0,0,.08); }
    label { display:block; font-weight:bold; margin-top:10px; }
    input, select, textarea { width:100%; padding:13px; border:1px solid #ddd; border-radius:12px; margin-top:6px; font-size:16px; }
    button { border:0; border-radius:12px; padding:13px 16px; font-weight:bold; font-size:16px; margin-top:12px; cursor:pointer; }
    .primary { background:#111; color:white; width:100%; }
    .secondary { background:#eee; color:#111; }
    .danger { background:#e53935; color:white; }
    .grid { display:grid; grid-template-columns:1fr; gap:10px; }
    .tech { border:1px solid #eee; border-radius:14px; padding:12px; margin:10px 0; }
    .tech strong { font-size:17px; }
    .small { color:#666; font-size:14px; margin-top:4px; line-height:1.4; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .logo { width:76px; height:76px; border-radius:18px; background:linear-gradient(135deg,#111,#777); margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:34px; }
    @media (min-width:700px){ .grid{grid-template-columns:1fr 1fr;} }
  </style>
</head>
<body>
<header>
  <div class="logo">IE</div>
  <h1>Immersion Eventos</h1>
  <p>Cadastro de técnicos e lista de equipe</p>
</header>

<main>
  <section class="card">
    <h2>Cadastrar técnico</h2>
    <div class="grid">
      <div><label>Nome</label><input id="nome" placeholder="Nome completo"></div>
      <div><label>Função</label><input id="funcao" placeholder="Ex: Técnico de som"></div>
      <div><label>RG</label><input id="rg" placeholder="RG"></div>
      <div><label>CPF</label><input id="cpf" placeholder="CPF"></div>
      <div><label>Telefone</label><input id="telefone" placeholder="Telefone"></div>
      <div><label>Status</label><select id="status"><option>Disponível</option><option>Indisponível</option></select></div>
    </div>
    <button class="primary" onclick="salvarTecnico()">Salvar técnico</button>
  </section>

  <section class="card">
    <h2>Dados do evento</h2>
    <div class="grid">
      <div><label>Evento</label><input id="evento" placeholder="Nome do evento"></div>
      <div><label>Cliente</label><input id="cliente" placeholder="Nome do cliente"></div>
      <div><label>Data</label><input id="data" type="date"></div>
      <div><label>Local</label><input id="local" placeholder="Local do evento"></div>
    </div>
  </section>

  <section class="card">
    <h2>Técnicos cadastrados</h2>
    <div id="lista"></div>
  </section>

  <section class="card">
    <h2>Lista para enviar ao cliente</h2>
    <textarea id="saida" rows="10" placeholder="A lista gerada aparecerá aqui"></textarea>
    <button class="primary" onclick="gerarLista()">Gerar lista</button>
    <button class="secondary" onclick="copiarLista()">Copiar lista</button>
  </section>
</main>

<script>
let tecnicos = JSON.parse(localStorage.getItem("tecnicosImmersion") || "[]");

function salvarTecnico(){
  const tecnico = {
    nome: nome.value.trim(),
    funcao: funcao.value.trim(),
    rg: rg.value.trim(),
    cpf: cpf.value.trim(),
    telefone: telefone.value.trim(),
    status: status.value
  };
  if(!tecnico.nome){ alert("Digite o nome do técnico."); return; }
  tecnicos.push(tecnico);
  localStorage.setItem("tecnicosImmersion", JSON.stringify(tecnicos));
  nome.value = funcao.value = rg.value = cpf.value = telefone.value = "";
  status.value = "Disponível";
  render();
}

function excluir(i){
  if(confirm("Excluir este técnico?")){
    tecnicos.splice(i,1);
    localStorage.setItem("tecnicosImmersion", JSON.stringify(tecnicos));
    render();
  }
}

function render(){
  const div = document.getElementById("lista");
  if(tecnicos.length === 0){
    div.innerHTML = "<p class='small'>Nenhum técnico cadastrado ainda.</p>";
    return;
  }
  div.innerHTML = tecnicos.map((t,i)=>`
    <div class="tech">
      <label>
        <input type="checkbox" class="selecionado" data-i="${i}">
        <strong>${t.nome}</strong>
      </label>
      <div class="small">
        Função: ${t.funcao || "-"}<br>
        RG: ${t.rg || "-"} | CPF: ${t.cpf || "-"}<br>
        Telefone: ${t.telefone || "-"} | Status: ${t.status}
      </div>
      <div class="actions">
        <button class="danger" onclick="excluir(${i})">Excluir</button>
      </div>
    </div>
  `).join("");
}

function gerarLista(){
  const selecionados = [...document.querySelectorAll(".selecionado:checked")]
    .map(c => tecnicos[Number(c.dataset.i)]);
  let texto = `IMMERSION EVENTOS\n\n`;
  texto += `Evento: ${evento.value || "-"}\n`;
  texto += `Cliente: ${cliente.value || "-"}\n`;
  texto += `Data: ${data.value || "-"}\n`;
  texto += `Local: ${local.value || "-"}\n\n`;
  texto += `EQUIPE ESCALADA:\n\n`;
  if(selecionados.length === 0){
    texto += "Nenhum técnico selecionado.";
  } else {
    selecionados.forEach((t, idx) => {
      texto += `${idx+1}. ${t.nome}\n`;
      texto += `Função: ${t.funcao || "-"}\n`;
      texto += `RG: ${t.rg || "-"}\n`;
      texto += `CPF: ${t.cpf || "-"}\n`;
      texto += `Telefone: ${t.telefone || "-"}\n\n`;
    });
  }
  saida.value = texto;
}

function copiarLista(){
  saida.select();
  document.execCommand("copy");
  alert("Lista copiada!");
}

render();
</script>
</body>
</html>
